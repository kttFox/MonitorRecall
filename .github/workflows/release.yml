name: Release

# v1.0 / v1.2.3 形式のタグを push するとビルドして GitHub Releases に公開する
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "バージョン (例: 1.0)。手動実行時はリリースを作らず成果物のみ"
        required: true
        default: "0.0"

permissions:
  contents: write

env:
  PROJECT: src/MonitorRecall/MonitorRecall.csproj
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $v = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $v = "${{ inputs.version }}"
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=v$v" >> $env:GITHUB_OUTPUT

      - name: Publish
        run: >
          dotnet publish ${{ env.PROJECT }} -c Release -r win-x64
          -p:PublishSingleFile=true
          -p:Version=${{ steps.ver.outputs.version }}
          -o out

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path out/* -DestinationPath "dist/MonitorRecall-${{ steps.ver.outputs.tag }}.zip"
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: MonitorRecall-${{ steps.ver.outputs.tag }}
          path: dist/*.zip

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          files: dist/*.zip
          generate_release_notes: true